services:
  - type: web
    name: localscene
    env: static
    rootDir: localscene
    buildCommand: npm install && npm run build
    publishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /assets/*
        headers:
          - name: Cache-Control
            value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
