# Nginx configuration for serving the LocalScene React + Vite Single Page Application (SPA).
# Place this file or its contents in /etc/nginx/sites-available/localscene and symlink it to sites-enabled.

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain or IP address (e.g., localscene.com www.localscene.com)
    server_name _;

    # The absolute path to the directory where the built static files are located on your VPS
    root /var/www/localscene/dist;
    index index.html;

    # Enable Gzip compression to speed up loading times over mobile and slow connections
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.web3forms.com;" always;

    # Primary route handling for SPA
    location / {
        # Check if the requested file exists, otherwise fallback to serving index.html
        # This is critical for supporting React Router client-side routes (e.g., /artists, /dashboard)
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets built by Vite aggressively as they include unique content hashes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Prevent access to hidden files (e.g., .htaccess, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages configuration
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
